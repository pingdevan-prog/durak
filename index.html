<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Durak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Felt table at night: deep green felt, brass trim, ivory cards. One-screen app: header, opponents, table, hand. */
  --felt: #12382c;
  --felt-hi: #1f5c47;
  --brass: #e0b354;
  --ivory: #fbf8f1;
  --red: #c23b3b;
  --ink: #1b1e24;
  --text: #e9efe9;
  --muted: #9fbcae;
  --blue: #6cb6ff;
  --font-display: 'Russo One', 'Arial Black', system-ui, sans-serif;
  --font-body: 'Rubik', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(120% 80% at 50% 40%, var(--felt-hi) 0%, var(--felt) 70%, #0b261e 100%);
  color: var(--text); font-family: var(--font-body);
  overflow: hidden; overscroll-behavior: none; touch-action: manipulation;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
button { font-family: inherit; }
button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
#app { height: 100%; display: flex; flex-direction: column; max-width: 760px; margin: 0 auto; padding: 0 12px; }

header { display: flex; align-items: center; gap: 10px; padding: 10px 0 6px; }
.brand { font-family: var(--font-display); font-size: 22px; letter-spacing: .04em; color: var(--brass); }
.trump-badge { display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: rgba(0,0,0,.25); font-size: 13px; color: var(--muted); }
.trump-badge b { font-size: 18px; line-height: 1; }
.trump-badge b.r { color: #ff7a7a; } .trump-badge b.k { color: var(--ivory); }
header .sp { flex: 1; }
.mp-btn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,.14); background: rgba(0,0,0,.2); color: var(--text); font: 600 13px var(--font-body); cursor: pointer; }
.mp-btn svg { width: 18px; height: 18px; }
.mp-btn.live { background: var(--brass); color: var(--ink); border-color: var(--brass); letter-spacing: .08em; }
.icon-btn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid rgba(255,255,255,.14); background: rgba(0,0,0,.2); color: var(--text); font-size: 17px; cursor: pointer; }

#opps { display: flex; gap: 8px; justify-content: center; padding: 4px 0; }
.opp { flex: 1; max-width: 220px; position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 6px 6px; border-radius: 14px; background: rgba(0,0,0,.18); border: 1px solid transparent; transition: border-color .2s, background .2s; }
.opp.att { border: 2px solid var(--brass); background: rgba(224,179,84,.12); }
.opp.def { border: 2px solid var(--blue); background: rgba(108,182,255,.12); }
.opp.turn { background: rgba(0,0,0,.32); }
.opp.out { opacity: .55; }
.opp.durak { border-color: var(--red); background: rgba(194,59,59,.18); opacity: 1; }
.backs { position: relative; height: 34px; width: 100%; }
.mini { position: absolute; top: 0; width: 24px; height: 34px; border-radius: 4px; background: repeating-linear-gradient(45deg, #7d1f2c 0 3px, #96283a 3px 6px); border: 2px solid var(--ivory); box-shadow: 0 1px 2px rgba(0,0,0,.4); }
.oname { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; }
.oname .nm { max-width: 9ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.av { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--ink); background: var(--muted); }
.cnt { font-variant-numeric: tabular-nums; color: var(--muted); }
.dots { display: inline-flex; gap: 3px; margin-left: 2px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--text); opacity: .3; animation: blink 1.2s infinite; }
.dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 60%, 100% { opacity: .25; transform: none; } 30% { opacity: 1; transform: translateY(-2px); } }
.role { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); min-height: 20px; padding: 2px 8px; border-radius: 999px; }
.role svg { width: 13px; height: 13px; }
.opp.att .role { color: var(--ink); background: var(--brass); } .opp.def .role { color: var(--ink); background: var(--blue); } .opp.durak .role { color: #fff; background: var(--red); }
#matchup { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px 10px; padding: 8px 0 2px; min-height: 48px; }
.mu { display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px 5px 8px; border-radius: 12px; font-weight: 700; font-size: 15px; color: var(--ink); }
.mu svg { width: 20px; height: 20px; flex: none; }
.mu > span { display: flex; flex-direction: column; line-height: 1.05; }
.mu small { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; opacity: .7; }
.mu.att { background: var(--brass); } .mu.def { background: var(--blue); }
.mu.me { box-shadow: 0 0 0 2px var(--ivory); }
.mu-arrow { font-size: 22px; color: var(--text); font-weight: 700; }
.mu-extra { flex-basis: 100%; text-align: center; font-size: 12px; color: var(--muted); }
.mu-done { font-family: var(--font-display); color: var(--brass); font-size: 18px; }
.xfer { width: calc(var(--cw) * 1.3); height: calc(var(--ch) * 1.24); border: 2px dashed var(--blue); border-radius: 10px; display: grid; place-items: center; text-align: center; font-size: 11px; line-height: 1.3; color: #cfe6ff; padding: 6px; background: rgba(108,182,255,.08); }
.xfer.target { background: rgba(108,182,255,.28); border-style: solid; }
.bub { position: absolute; top: -6px; right: -4px; background: var(--ivory); color: var(--ink); font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 999px; box-shadow: 0 2px 6px rgba(0,0,0,.35); animation: pop .25s ease-out; white-space: nowrap; }
.bub.take { background: var(--red); color: #fff; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

#board { flex: 1; min-height: 0; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; padding: 6px 0; border-radius: 18px; transition: background .15s, box-shadow .15s; --cw: clamp(44px, min(14vw, 8.6vh), 84px); --ch: calc(var(--cw) * 1.42); }
#board.dropzone { box-shadow: inset 0 0 0 2px rgba(224,179,84,.35); }
#board.over { background: rgba(224,179,84,.08); box-shadow: inset 0 0 0 2px rgba(224,179,84,.8); }
#deckZone, #discardZone { display: flex; flex-direction: column; align-items: center; gap: 6px; width: calc(var(--cw) * 1.05); }
#deckZone { width: calc(var(--cw) * 1.5); align-items: flex-start; }
#deckZone .small, #deckZone .empty-trump { align-self: flex-start; }
.pile { position: relative; width: var(--cw); height: var(--ch); }
.pile .card { left: 0; top: 0; }
.trumpCard { transform: translateX(calc(var(--cw) * .42)) rotate(90deg); }
.deckTop { transform: translate(-3px, -3px); box-shadow: 2px 2px 0 #e9e4d6, 4px 4px 0 rgba(0,0,0,.25) !important; }
.small { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: center; }
.empty-trump { width: var(--cw); height: var(--ch); border-radius: 8px; border: 2px dashed rgba(255,255,255,.18); display: grid; place-items: center; font-size: calc(var(--cw) * .55); opacity: .7; }
.empty-trump.r { color: #ff7a7a; }
#discardZone .pile .card { transform: rotate(var(--rot)); }
#table { display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 6px 4px; min-height: calc(var(--ch) * 1.25); height: 100%; }
.slot { position: relative; width: calc(var(--cw) * 1.3); height: calc(var(--ch) * 1.24); }
.slot .pa, .slot .pd { position: absolute; width: var(--cw); height: var(--ch); }
.slot .pa { left: 0; top: 0; }
.slot .pd { left: calc(var(--cw) * .3); top: calc(var(--ch) * .24); transform: rotate(7deg); }
.slot .pa .card, .slot .pd .card { left: 0; top: 0; }
.slot.open .pa .card { box-shadow: 0 0 0 2px rgba(255,255,255,.0), 0 4px 10px rgba(0,0,0,.25); }
.slot.target .pa .card { box-shadow: 0 0 0 3px var(--brass), 0 6px 16px rgba(0,0,0,.35); }
.table-hint { color: var(--muted); font-size: 14px; text-align: center; padding: 0 10px; max-width: 220px; line-height: 1.4; }

.card { position: absolute; width: var(--cw); height: var(--ch); border-radius: calc(var(--cw) * .11); background: var(--ivory); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.35), 0 4px 10px rgba(0,0,0,.2); touch-action: none; cursor: grab; }
.card.red { color: var(--red); }
.card .ix { position: absolute; left: 7%; top: 4%; display: flex; flex-direction: column; align-items: center; line-height: .95; font-weight: 700; }
.card .ix b { font-size: calc(var(--cw) * .27); letter-spacing: -.04em; }
.card .ix i { font-style: normal; font-size: calc(var(--cw) * .24); }
.card .pip { position: absolute; right: 9%; bottom: 5%; font-size: calc(var(--cw) * .56); line-height: 1; }
.card.trump::after { content: ''; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 2px var(--brass); pointer-events: none; }
.card.back { background: repeating-linear-gradient(45deg, #7d1f2c 0 4px, #96283a 4px 8px); border: 3px solid var(--ivory); }

#bar { display: flex; align-items: center; gap: 8px; padding: 6px 0; min-height: 50px; }
#status { flex: 1; font-size: 14px; line-height: 1.3; color: var(--text); }
#status .me-role { display: inline-block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 6px; margin-right: 6px; background: rgba(0,0,0,.3); color: var(--muted); vertical-align: 1px; }
#status .me-role.att { color: var(--ink); background: var(--brass); } #status .me-role.def { color: var(--ink); background: var(--blue); }
#handWrap.role-att { background: linear-gradient(to top, rgba(224,179,84,.16), rgba(224,179,84,.04)); box-shadow: inset 0 2px 0 var(--brass); }
#handWrap.role-def { background: linear-gradient(to top, rgba(108,182,255,.18), rgba(108,182,255,.04)); box-shadow: inset 0 2px 0 var(--blue); }
#timer { height: 5px; border-radius: 3px; background: rgba(0,0,0,.25); overflow: hidden; opacity: 0; transition: opacity .2s; margin-top: 4px; }
#timer.on { opacity: 1; }
#timer i { display: block; height: 100%; width: 100%; background: var(--brass); border-radius: 3px; }
.btn { height: 40px; padding: 0 14px; border-radius: 12px; border: 0; font-weight: 700; font-size: 15px; cursor: pointer; }
.btn.primary { background: var(--brass); color: var(--ink); }
.btn.danger { background: var(--red); color: #fff; }
.btn.ghost { background: rgba(0,0,0,.25); color: var(--text); border: 1px solid rgba(255,255,255,.14); }
.btn[hidden] { display: none; }

#handWrap { position: relative; padding: 6px 6px calc(10px + env(safe-area-inset-bottom)); margin: 0 -6px; border-radius: 16px 16px 0 0; transition: background .2s, box-shadow .2s; --cw: clamp(54px, 15.5vw, 84px); --ch: calc(var(--cw) * 1.42); }
#hand { position: relative; height: calc(var(--ch) + 8px); }
#hand .card { transition: left .22s ease, top .22s ease, transform .15s ease, filter .15s, opacity .15s; }
#hand .card.dim { filter: brightness(.62) saturate(.7); }
#hand .card.src { opacity: .25; }
#hand .card.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
.dragghost { position: fixed !important; left: 0; top: 0; z-index: 1000; pointer-events: none; box-shadow: 0 14px 30px rgba(0,0,0,.45) !important; transition: none !important; }
.flyer { position: fixed; z-index: 900; pointer-events: none; margin: 0; }

#toast { position: absolute; left: 50%; bottom: calc(100% + 4px); transform: translateX(-50%); background: rgba(10,20,16,.92); color: var(--text); font-size: 13px; padding: 8px 12px; border-radius: 10px; max-width: 92%; text-align: center; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; border: 1px solid rgba(255,255,255,.12); }
#toast.show { opacity: 1; }

#sheet { position: fixed; inset: 0; background: rgba(4,12,9,.62); display: none; align-items: flex-end; justify-content: center; z-index: 2000; }
#sheet.show { display: flex; }
.panel { width: 100%; max-width: 520px; background: #163f32; border-radius: 20px 20px 0 0; padding: 20px 18px calc(22px + env(safe-area-inset-bottom)); border-top: 1px solid rgba(255,255,255,.12); max-height: 88%; overflow-y: auto; animation: up .25s ease-out; }
@media (min-width: 600px) { #sheet { align-items: center; } .panel { border-radius: 20px; } }
@keyframes up { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.panel.noanim { animation: none; }
.panel h2 { font-family: var(--font-display); font-weight: 400; color: var(--brass); margin: 0 0 10px; font-size: 24px; text-wrap: balance; }
.panel p, .panel li { color: var(--text); font-size: 14px; line-height: 1.5; }
.panel ul { padding-left: 18px; margin: 6px 0 12px; }
.panel .lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 6px; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; height: 40px; border-radius: 10px; border: 1px solid rgba(255,255,255,.16); background: rgba(0,0,0,.2); color: var(--text); font-weight: 500; font-size: 14px; cursor: pointer; }
.seg button.on { background: var(--brass); color: var(--ink); border-color: var(--brass); font-weight: 700; }
.row { display: flex; gap: 8px; margin-top: 18px; }
.row .btn { flex: 1; }
.stats { display: flex; gap: 8px; margin-top: 8px; }
.stats div { flex: 1; background: rgba(0,0,0,.2); border-radius: 12px; padding: 10px; text-align: center; }
.stats b { display: block; font-family: var(--font-display); font-size: 22px; color: var(--brass); font-weight: 400; font-variant-numeric: tabular-nums; }
.stats span { font-size: 12px; color: var(--muted); }
.av.hu { background: var(--brass); }
.btn.wide { width: 100%; height: 48px; font-size: 16px; }
.btn:disabled, .seg button:disabled { opacity: .35; cursor: default; }
.muted { color: var(--muted) !important; }
.center { text-align: center; }
.small-p { font-size: 13px !important; }
.list { display: flex; flex-direction: column; gap: 8px; }
.li { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,.14); background: rgba(0,0,0,.2); color: var(--text); text-align: left; cursor: pointer; font: inherit; }
.li span:first-child { display: flex; flex-direction: column; gap: 2px; }
.li small { color: var(--muted); font-size: 12px; }
.li .go { font-weight: 700; color: var(--brass); }
.codeform { display: flex; gap: 8px; }
.textin { width: 100%; height: 44px; border-radius: 12px; border: 1px solid rgba(255,255,255,.18); background: rgba(0,0,0,.25); color: var(--text); font: 500 16px var(--font-body); padding: 0 12px; }
.textin:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }
.codeform input { flex: 1; min-width: 0; height: 44px; border-radius: 12px; border: 1px solid rgba(255,255,255,.18); background: rgba(0,0,0,.25); color: var(--text); font: 700 20px var(--font-display); letter-spacing: .25em; text-transform: uppercase; text-align: center; padding: 0 10px; }
.codeform input:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }
.codebox { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px; border-radius: 14px; background: rgba(0,0,0,.25); border: 1px dashed rgba(224,179,84,.5); text-align: center; }
.codebox small { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.codebox b { font-family: var(--font-display); font-weight: 400; font-size: 40px; letter-spacing: .2em; color: var(--brass); line-height: 1.1; }
.codebox span { font-size: 13px; color: var(--muted); }
.seats { display: flex; flex-direction: column; gap: 6px; margin-bottom: 4px; }
.seatrow { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: rgba(0,0,0,.2); font-size: 14px; }
.seatrow.bot { color: var(--muted); }
.result-big { font-size: 46px; text-align: center; margin: 4px 0 2px; }
#bar { position: relative; }
#emoBtn { padding: 0 10px; font-size: 18px; }
#emoPop { position: absolute; right: 0; bottom: calc(100% + 6px); display: none; gap: 2px; padding: 6px; background: rgba(10,20,16,.96); border-radius: 14px; border: 1px solid rgba(255,255,255,.14); z-index: 60; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
#emoPop.show { display: flex; }
#emoPop button { width: 42px; height: 42px; font-size: 24px; border: 0; background: transparent; border-radius: 10px; cursor: pointer; }
#emoPop button:active { background: rgba(255,255,255,.12); }
.emo { position: fixed; z-index: 1200; font-size: 40px; line-height: 1; pointer-events: none; transform: translate(-50%, -50%); animation: emo 2.2s ease-out forwards; filter: drop-shadow(0 4px 8px rgba(0,0,0,.4)); }
@keyframes emo { 0% { transform: translate(-50%, -30%) scale(.4); opacity: 0; } 15% { transform: translate(-50%, -70%) scale(1.2); opacity: 1; } 70% { opacity: 1; } 100% { transform: translate(-50%, -150%) scale(1); opacity: 0; } }
#netBanner { position: fixed; top: calc(6px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 1500; max-width: calc(100% - 32px); padding: 8px 14px; border-radius: 12px; background: rgba(120,30,30,.95); color: #fff; font-size: 13px; font-weight: 500; text-align: center; box-shadow: 0 6px 18px rgba(0,0,0,.35); display: none; }
#netBanner.show { display: block; }
.clock { display: inline-block; margin-left: 4px; padding: 1px 7px; border-radius: 6px; background: rgba(194,59,59,.85); color: #fff; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
#handWrap.nudge { animation: nudge .7s ease-out; }
@keyframes nudge { 0% { box-shadow: inset 0 0 0 0 rgba(255,255,255,0); } 30% { box-shadow: inset 0 0 0 3px rgba(255,255,255,.7); } 100% { box-shadow: inset 0 0 0 0 rgba(255,255,255,0); } }
.textin.shake { animation: shake .35s; }
.seatrow .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: #5fd38a; box-shadow: 0 0 0 3px rgba(95,211,138,.2); }
.tally { display: flex; flex-direction: column; gap: 4px; }
.tally div { display: flex; justify-content: space-between; padding: 6px 10px; border-radius: 8px; background: rgba(0,0,0,.18); font-size: 14px; }
.tally b { color: var(--brass); font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">DURAK</div>
    <div class="trump-badge" id="trumpBadge"></div>
    <div class="sp"></div>
    <button class="mp-btn" id="mpBtn" aria-label="Play with friends"></button>
    <button class="icon-btn" id="rulesBtn" aria-label="How to play">?</button>
    <button class="icon-btn" id="menuBtn" aria-label="Game menu">☰</button>
  </header>
  <section id="opps"></section>
  <div id="matchup" aria-live="polite"></div>
  <section id="board">
    <div id="deckZone"></div>
    <div id="table"></div>
    <div id="discardZone"></div>
  </section>
  <div id="timer"><i></i></div>
  <div id="bar">
    <div id="status"></div>
    <button class="btn ghost" id="emoBtn" aria-label="Send a reaction" hidden>😀</button>
    <div id="emoPop" role="menu"></div>
    <button class="btn ghost" id="sortBtn">Sort</button>
    <button class="btn danger" id="takeBtn" hidden>Take</button>
  </div>
  <section id="handWrap">
    <div id="toast"></div>
    <div id="hand"></div>
  </section>
</div>
<div id="netBanner" role="status" aria-live="polite"></div>
<div id="sheet"><div class="panel" id="panel"></div></div>
<script>
// ===== Durak engine (podkidnoy, 36 cards) =====
const RANKS = ['6','7','8','9','10','J','Q','K','A'];
const SUITS = ['♠','♥','♦','♣'];
const S = id => Math.floor(id / 9);
const R = id => id % 9;
let G = null;
const MAX_BOUT = 5;
const Hooks = {
  now() { return Date.now(); }, windowMs() { return 4000; }, turnMs(p) { return 0; },
  name(p) { return 'P' + p; },
  render() {}, schedule(ms) {}, onPlay(p, id, kind, i) {}, beforeClear(took) {}, onOver() {}
};

function isTrump(id) { return S(id) === G.trump; }
function val(id) { return R(id) + (isTrump(id) ? 9 : 0); }
function beats(a, d) { return (S(d) === S(a) && R(d) > R(a)) || (isTrump(d) && !isTrump(a)); }

  net.phase = 'game';
  if (fresh) { if (sheetKind === 'client' || sheetKind === 'result') closeSheet(); toast(introText(G.introData), 3600); }
  else if (wasJoining && sheetKind === 'client') closeSheet();
  render();
  if (!fresh && prev && !prev.over && G.over) gameOverLocal();
  if (G.over && sheetKind == null && fresh) showResult();
}
function showClientLobby() {
  const ppl = net.players || [];
  const total = Math.max(net.seats || 4, ppl.length);
  const rows = [];
  for (let i = 0; i < total; i++) {
    const p = ppl[i];
    if (p) {
      const isMe = p.by === net.myBy;
      const name = isMe ? 'You' : (p.nick || 'Friend') + (p.host ? ' (host)' : '');
      rows.push(`<div class="seatrow"><span class="av hu">${esc((p.nick || '?')[0])}</span><span class="grow">${esc(name)}</span>${!isMe && !p.live ? '<span class="muted small-p">connecting…</span>' : ''}</div>`);
    } else rows.push(`<div class="seatrow bot"><span class="av">B</span><span class="grow">Bot</span><span class="muted small-p">open seat</span></div>`);
  }
  const joining = net.phase === 'joining';
  const inGame = net.phase === 'game' && G && !G.over;
  const host = ppl.find(p => p.host);
  openSheet(`<h2>${joining ? 'Joining table…' : 'Table ' + esc((net.code || '').toUpperCase())}</h2>
    ${joining ? `<p class="muted">Connecting to table ${esc((net.code || '').toUpperCase())}…</p>` : `<div class="seats">${rows.join('')}</div>
    <p class="muted">${inGame ? (me >= 0 ? 'Game in progress.' : "A game is in progress. You'll be dealt in next game.") : `Waiting for ${esc(host ? host.nick : 'the host')} to deal…`}</p>${tallyHTML()}`}
    <div class="row"><button class="btn ghost" id="leaveB">Leave table</button>${inGame ? `<button class="btn primary" id="backB">Back to game</button>` : ''}</div>`, 'client');
  $('#leaveB').onclick = leaveTable;
  if (inGame) $('#backB').onclick = closeSheet;
}

// ----- friends sheet -----
function nickField() {
  return `<div class="lbl">Your name</div>
    <input id="nickI" class="textin" maxlength="16" autocomplete="nickname" placeholder="Your name" value="${esc(net.myNick)}" aria-label="Your name">`;
}
function showFriends() {
  openSheet(`<h2>Play with friends</h2>${nickField()}
    <div style="height:12px"></div>
    <button class="btn primary wide" id="hostB">Host a table</button>
    <div class="lbl">Join a friend's table</div>
    <form id="codeF" class="codeform"><input id="codeI" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD" aria-label="Table code"><button class="btn ghost" type="submit">Join</button></form>
    <p class="muted small-p">The host taps Host a table and sends the invite link. Everyone plays on their own phone. If a school or work Wi-Fi blocks the connection, switch to mobile data.</p>
    <div class="row"><button class="btn ghost" id="closeB">Back to bots</button></div>`, 'friends');
  loadPeerJS().catch(() => {});
  $('#closeB').onclick = closeSheet;
  $('#hostB').onclick = hostTable;
  $('#codeF').onsubmit = e => {
    e.preventDefault();
    const c = $('#codeI').value.trim().toLowerCase();
    if (/^[a-z0-9]{4}$/.test(c)) joinTable(c); else toast('Codes are 4 letters or numbers.');
  };
}
function showJoinPrompt(code) {
  if (mode === 'solo') clearTimeout(timer);
  openSheet(`<h2>Join table ${esc(code.toUpperCase())}</h2>
    <p class="muted" style="margin-top:0">A friend invited you to play Durak.</p>${nickField()}
    <div style="height:14px"></div>
    <button class="btn primary wide" id="joinB">Join table</button>
    <div class="row"><button class="btn ghost" id="soloB">Play vs bots instead</button></div>`, 'join');
  loadPeerJS().catch(() => {});
  $('#joinB').onclick = () => joinTable(code);
  $('#soloB').onclick = () => { setHash(null); closeSheet(); if (mode === 'solo' && G && !G.over) Hooks.schedule('think'); };
  const i = $('#nickI');
  i.addEventListener('keydown', e => { if (e.key === 'Enter') joinTable(code); });
  if (!net.myNick) setTimeout(() => i.focus(), 300);
}

// ----- emotes -----
function showEmote(seat, e) {
  let x, y;
  if (seat === me) { const b = $('#hand').getBoundingClientRect(); x = b.left + b.width / 2; y = b.top; }
  else {
    const o = document.getElementById('opp-' + seat); if (!o) return;
    const b = o.getBoundingClientRect(); x = b.left + b.width / 2; y = b.top + b.height * 0.55;
  }
  const el = document.createElement('div');
  el.className = 'emo'; el.textContent = e;
  el.style.left = x + 'px'; el.style.top = y + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2300);
}
function sendEmote(e) {
  $('#emoPop').classList.remove('show');
  if (mode === 'host') relayEmote(0, e);
  else if (mode === 'client' && net.tbl && me >= 0) {
    const now = Date.now();
    if (now - (net.emoAt.me || 0) < 900) return;
    net.emoAt.me = now;
    showEmote(me, e);
    net.tbl.emit('emo', { e }).catch(() => {});
  }
}
$('#emoPop').innerHTML = EMOJIS.map(e => `<button aria-label="Send ${e}">${e}</button>`).join('');
$('#emoPop').addEventListener('click', e => { const b = e.target.closest('button'); if (b) sendEmote(b.textContent); });
$('#emoBtn').onclick = e => { e.stopPropagation(); $('#emoPop').classList.toggle('show'); };
document.addEventListener('pointerdown', e => { if (!e.target.closest('#emoPop, #emoBtn')) $('#emoPop').classList.remove('show'); });

// ----- connection banner -----
function renderNetBanner() {
  const b = $('#netBanner');
  let msg = '';
  if (mode === 'client' && net.reconnecting && net.phase !== 'joining') msg = 'Reconnecting to the table…';
  else if (mode === 'host' && net.phase === 'game' && G && !G.over) {
    const away = seatInfo.filter((s, i) => i > 0 && s.k === 'hu' && s.gone).map(s => s.nick);
    if (away.length) msg = `${listNames(away)} ${away.length > 1 ? 'are' : 'is'} offline. A bot plays for them until they're back.`;
  }
  b.textContent = msg;
  b.classList.toggle('show', !!msg);
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (mode !== 'solo') keepAwake(true);
  if (mode === 'host' && net.tbl) { net.tbl.wake(); hostTick(); broadcast(); }
  if (mode === 'client') {
    if (!net.reconnecting && net.phase !== 'joining' && (!net.tbl || Date.now() - net.lastState > 3500)) startReconnect();
    else sendHello();
  }
});
window.addEventListener('hashchange', () => {
  const c = hashCode();
  if (c && !(mode === 'client' && net.code === c) && !(mode === 'host' && net.code === c)) showJoinPrompt(c);
});

// ----- solo -----
let lastDurak = load('durak-last', { p: null, n: 0 });
function startSolo() {
  clearTimeout(timer);
  mode = 'solo'; me = 0;
  const n = settings.opps + 1;
  seatInfo = [{ k: 'hu', nick: 'You' }];
  for (let i = 1; i < n; i++) seatInfo.push({ k: 'bot', nm: BOT_NAMES[i - 1] });
  const fd = lastDurak.n === n ? lastDurak.p : null;
  resetHandView(); gid++;
  newGame({ players: n, humans: seatInfo.map((s, i) => i === 0), firstDefender: fd });
  render();
  toast(introText(G.introData), 3600);
  Hooks.schedule('think');
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => G && layoutHand(myHand()));
startSolo();
setInterval(() => { if (G && !G.over && G.turnDeadline) renderBar(); }, 1000);
(function boot() {
  const sess = ss('durak-session'), hc = hashCode();
  const fresh = sess && Date.now() - (sess.at || 0) < SESSION_MAX;
  if (fresh && sess.role === 'host' && (!hc || hc === sess.code)) { restoreHost(sess); return; }
  if (fresh && sess.role === 'client' && (!hc || hc === sess.code)) { joinTable(sess.code, true); return; }
  if (hc) { save('durak-seen', { v: 1 }); showJoinPrompt(hc); return; }
  if (!load('durak-seen', { v: 0 }).v) { save('durak-seen', { v: 1 }); setTimeout(showRules, 400); }
})();

</script>
</body>
</html>
